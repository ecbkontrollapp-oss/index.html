name: Generate mobile app icons

on:
  push:
    branches: [main]
    paths:
      - 'icons/app-icon.svg'
      - '.github/workflows/generate-app-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Generate PNG icons for iPhone and Android
        shell: bash
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          icon = Path("icons/app-icon.svg")
          assert icon.exists()
          sizes = {
              "icons/apple-touch-icon.png": 180,
              "icons/icon-192.png": 192,
              "icons/icon-512.png": 512,
          }
          for filename, size in sizes.items():
              cairosvg.svg2png(url=str(icon), write_to=filename, output_width=size, output_height=size)
              assert Path(filename).stat().st_size > 1000
              print(f"Created {filename} ({size}x{size})")
          PY
      - name: Commit generated app icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate home screen PNG icons"
            git push origin HEAD:main
          fi
